name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the comparison builds the base branch from history
          persist-credentials: false  # no step pushes, so keep the token out of .git/config
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Generate the tables CI needs (customers needs the Synthea jar, so it is left out)
        run: uv run generate customer_activity && uv run generate daily_events
      - name: dbt build
        run: uv run dbt build --exclude path:models/customers
      - name: Tests
        run: uv run pytest -q --ignore tests/test_customers.py
      - name: Compare daily_events per day with ${{ github.base_ref }}
        run: uv run python scripts/compare_daily_events.py origin/${{ github.base_ref }}
