[project]
name = "platform-analytics"
version = "0.1.0"
description = "Demo repo with seeded synthetic data and dbt-duckdb models."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.1",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
generate = "generate.cli:main"
check = "checks.cli:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["generate", "checks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
